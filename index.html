<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Финансовый Трекер | Monex Style</title>
  <link rel="stylesheet" href="style.css">
  <!-- Подключение иконкового шрифта FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="app-container">
    <!-- Шапка профиля -->
    <header class="header">
      <div class="user-info">
        <div class="avatar">
          <i class="fa-solid fa-user"></i>
        </div>
        <div>
          <h2>Мой Баланс</h2>
          <p class="subtitle">Управление финансами</p>
        </div>
      </div>
      <div class="header-icon">
        <i class="fa-regular fa-bell"></i>
      </div>
    </header>

    <!-- Главная карточка с балансом -->
    <div class="card balance-card">
      <span class="card-label">Общий баланс</span>
      <div class="balance-amount" id="totalBalance">0 ₽</div>
      
      <div class="balance-stats">
        <div class="stat-item income">
          <i class="fa-solid fa-arrow-down"></i>
          <div>
            <span>Доходы</span>
            <strong id="totalIncome">0 ₽</strong>
          </div>
        </div>
        <div class="stat-item expense">
          <i class="fa-solid fa-arrow-up"></i>
          <div>
            <span>Расходы</span>
            <strong id="totalExpense">0 ₽</strong>
          </div>
        </div>
      </div>
    </div>

    <!-- Сводка обязательных платежей (Кредиты и Ипотека) -->
    <div class="card credit-summary-card">
      <div class="credit-header">
        <i class="fa-solid fa-house-credit-card"></i>
        <span>Кредиты и Ипотека (в месяц)</span>
      </div>
      <div class="credit-amount" id="totalCredits">0 ₽</div>
    </div>

    <!-- Форма добавления операции -->
    <section class="section">
      <h3><i class="fa-solid fa-plus-circle"></i> Добавить запись</h3>
      <form id="financeForm" class="finance-form">
        <div class="form-group">
          <label for="type">Тип записи</label>
          <select id="type" required>
            <option value="expense">Расход</option>
            <option value="income">Доход</option>
            <option value="credit">Обязательный платеж (Кредит / Ипотека)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="title">Название</label>
          <input type="text" id="title" placeholder="Например: Зарплата, Ипотека, Продукты" required>
        </div>

        <div class="form-group">
          <label for="amount">Сумма (₽)</label>
          <input type="number" id="amount" placeholder="0" min="0" step="any" required>
        </div>

        <button type="submit" class="btn-submit">Добавить запись</button>
      </form>
    </section>

    <!-- Список обязательных платежей -->
    <section class="section">
      <h3><i class="fa-solid fa-calendar-check"></i> Кредиты и Обязательства</h3>
      <div class="transactions-list" id="creditList">
        <p class="empty-text">Нет активных кредитов или ипотек</p>
      </div>
    </section>

    <!-- Список последних транзакций -->
    <section class="section">
      <h3><i class="fa-solid fa-list-check"></i> История операций</h3>
      <div class="transactions-list" id="transactionList">
        <p class="empty-text">Список транзакций пуст</p>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
